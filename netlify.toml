[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

# Friendly URL: /api/bgg → /.netlify/functions/bgg
[[redirects]]
  from = "/api/bgg"
  to = "/.netlify/functions/bgg"
  status = 200

# Sessions API — splat catches all sub-paths (/api/sessions, /api/sessions/abc/vote, etc.)
[[redirects]]
  from = "/api/sessions/*"
  to = "/.netlify/functions/sessions/:splat"
  status = 200

[[redirects]]
  from = "/api/sessions"
  to = "/.netlify/functions/sessions"
  status = 200

# Backup API — for personal data sync via backup code
[[redirects]]
  from = "/api/backup/*"
  to = "/.netlify/functions/backup/:splat"
  status = 200

# /vote/:sessionId is a frontend route — let React handle it
[[redirects]]
  from = "/vote/*"
  to = "/index.html"
  status = 200
